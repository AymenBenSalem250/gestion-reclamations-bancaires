<header class="navbar">
  <div class="navbar-left">
    <button type="button" class="menu-toggle" (click)="onMenuToggle()" aria-label="Ouvrir le menu">
      <i class="pi pi-bars"></i>
    </button>
    <h1 class="page-title">{{ pageTitle }}</h1>
  </div>

  <div class="navbar-right">
    <!-- Notifications -->
    <div class="nav-item notifications" (click)="toggleDropdown()">
      <i class="pi pi-bell"></i>
      <span class="badge" [class.pulse]="pulse" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      
      <!-- Notifications Dropdown -->
      <div class="notifications-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
        <div class="dropdown-header">
          <h4>Notifications</h4>
          <span class="unread-label">{{ unreadCount }} non lues</span>
        </div>
        <div class="dropdown-body">
          <div *ngIf="notifications.length === 0" class="no-notifications">
            Aucune notification
          </div>
          <div *ngFor="let n of notifications" 
               class="notification-item" 
               [class.unread]="!n.isRead"
               (click)="handleNotificationClick(n)">
            <div class="notification-icon">
              <i class="pi pi-envelope"></i>
            </div>
            <div class="notification-content">
              <p>{{ n.message }}</p>
              <span class="notification-time">{{ n.createdAt | date:'short' }}</span>
            </div>
            <div class="unread-dot" *ngIf="!n.isRead"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dark Mode Toggle -->
    <button type="button" class="theme-toggle-btn" (click)="toggleDarkMode()" aria-label="Toggle Dark Mode">
      <i [class]="isDarkMode ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>

    <div class="nav-divider"></div>

    <!-- User Dropdown -->
    <div class="nav-item user-menu">
      <img src="assets/images/avatar.png" alt="Avatar" class="avatar-img" />
      <div class="user-details">
        <span class="user-name">Admin</span>
        <span class="user-subtitle">Administrateur</span>
      </div>
      <i class="pi pi-chevron-down chevron-icon"></i>
    </div>
  </div>
</header>

<div class="dialog-backdrop" *ngIf="visible" (click)="onCancel()">
  <div class="dialog-box" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <div class="dialog-icon" [class.danger]="danger" aria-hidden="true">
      <svg *ngIf="danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
      <svg *ngIf="!danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h2 class="dialog-title">{{ title }}</h2>
    <p class="dialog-message">{{ message }}</p>

    <div class="dialog-actions">
      <button type="button" class="btn btn-cancel" (click)="onCancel()" [disabled]="loading">
        {{ cancelLabel }}
      </button>
      <button type="button"
              class="btn btn-confirm"
              [class.btn-danger]="danger"
              (click)="onConfirm()"
              [disabled]="loading">
        {{ loading ? 'Traitement...' : confirmLabel }}
      </button>
    </div>

  </div>
</div>

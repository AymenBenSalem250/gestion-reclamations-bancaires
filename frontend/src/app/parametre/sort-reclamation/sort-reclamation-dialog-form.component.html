<div class="form-backdrop" *ngIf="visible" (click)="onClose()">
  <div class="form-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="form-dialog-header">
      <h2>{{ title }}</h2>
      <button type="button" class="form-close" (click)="onClose()" aria-label="Fermer">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-dialog-body">
        <div class="form-api-error" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="form-group">
          <label>Code <span class="required">*</span></label>
          <input type="text" formControlName="codSta" [class.invalid]="isInvalid('codSta')" placeholder="Ex: NOU" />
          <div class="form-error" *ngIf="isInvalid('codSta')">Le code est obligatoire.</div>
        </div>
        <div class="form-group">
          <label>Libellé <span class="required">*</span></label>
          <input type="text" formControlName="libSta" [class.invalid]="isInvalid('libSta')" placeholder="Ex: Nouveau" />
          <div class="form-error" *ngIf="isInvalid('libSta')">Le libellé est obligatoire.</div>
        </div>
        <div class="form-group">
          <label>Message 1</label>
          <input type="text" formControlName="msgSta" placeholder="Message 1" />
        </div>
        <div class="form-group">
          <label>Message 2</label>
          <input type="text" formControlName="msg2Sta" placeholder="Message 2" />
        </div>
      </div>
      <div class="form-dialog-footer">
        <button type="button" class="form-btn form-btn-cancel" (click)="onClose()" [disabled]="saving">Annuler</button>
        <button type="submit" class="form-btn form-btn-save" [disabled]="saving">{{ saving ? 'Enregistrement...' : 'Enregistrer' }}</button>
      </div>
    </form>
  </div>
</div>

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/reclamation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=info
logging.level.org.springframework.security=info

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8


# Internal SMS API
sms.api.url=http://localhost:8081/api/send
sms.api.timeout=3000

# uploads
file.upload-dir=uploads/messages
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB